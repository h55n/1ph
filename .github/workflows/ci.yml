name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, Type Check + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd packages/db && npx prisma generate

      - name: Type check (web)
        run: cd apps/web && npx tsc --noEmit

      - name: Lint
        run: npx turbo lint

      - name: Web tests
        run: npm run test --workspace apps/web

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Pipeline tests
        run: python -m pytest -q pipeline/tests
