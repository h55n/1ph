name: Daily Pipeline Run

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  run-pipeline:
    name: Run Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - id: setup-chrome
        name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/schema.prisma

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx ts-node apps/pipeline/scheduler/run-once.ts

      - name: Revalidate website cache
        env:
          WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
          WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
        run: |
          if [ -z "$WEB_REVALIDATE_URL" ] || [ -z "$WEB_REVALIDATE_SECRET" ]; then
            echo "Skipping website revalidation: WEB_REVALIDATE_URL or WEB_REVALIDATE_SECRET not configured."
            exit 0
          fi

          curl --fail-with-body --show-error --silent \
            -X POST "$WEB_REVALIDATE_URL" \
            -H "Authorization: Bearer $WEB_REVALIDATE_SECRET" \
            -H "Content-Type: application/json"
