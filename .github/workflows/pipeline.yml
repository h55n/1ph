name: Daily Hackathon Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    name: Run Pipeline
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install Playwright browsers
        # Install both Chromium (for fallback) and Firefox (for ZeroCrawl hardened mode)
        run: |
          playwright install chromium --with-deps
          playwright install firefox --with-deps

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python pipeline/run.py

      - name: Revalidate frontend cache
        if: always()
        continue-on-error: true
        env:
          WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
          WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
        run: |
          if [ -z "$WEB_REVALIDATE_URL" ] || [ -z "$WEB_REVALIDATE_SECRET" ]; then
            echo "Skipping revalidation: secrets not set"
            exit 0
          fi
          curl --fail-with-body --silent \
            -X POST "$WEB_REVALIDATE_URL" \
            -H "Authorization: Bearer $WEB_REVALIDATE_SECRET" \
            -H "Content-Type: application/json" || true
