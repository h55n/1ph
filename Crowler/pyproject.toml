[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zerocrawl"
version = "1.0.0"
description = "Zero-cost, plug-and-play web scraping engine — no paid APIs, no infrastructure, one function call."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["scraping", "crawling", "web", "html", "playwright", "anti-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    # HTTP & TLS mimicry
    "curl-cffi>=0.7.0",
    # Browser automation
    "playwright>=1.44.0",
    "camoufox[geoip]>=0.4.0",
    # HTML parsing & content extraction
    "selectolax>=0.3.21",
    "trafilatura>=1.10.0",
    # Data models & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Async DB
    "aiosqlite>=0.20.0",
    # REST API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Markdown conversion
    "markdownify>=0.12.1",
    "html2text>=2024.2.26",
    # Date parsing
    "dateparser>=1.2.0",
    # Logging
    "loguru>=0.7.2",
    # Utilities
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "charset-normalizer>=3.3.0",
    "tldextract>=5.1.2",
]

[project.optional-dependencies]
ai = [
    "ollama>=0.2.1",
    "openai>=1.35.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.7.0",
]
proxy = [
    "stem>=1.8.2",
    "requests[socks]>=2.32.0",
    "PySocks>=1.7.1",
]
all = [
    "zerocrawl[ai,proxy]",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpretty>=1.1.4",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
zerocrawl = "zerocrawl.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["zerocrawl*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
